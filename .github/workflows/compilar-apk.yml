name: Compilar APK de NÚMEN
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Obtener el proyecto
        uses: actions/checkout@v4
      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar el SDK Android instalado en GitHub
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK de depuración
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Validar el instalador
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" | tail -n 2
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 8
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          mkdir -p instalador
          cp "$APK" instalador/NUMEN_0_4_Android.apk
      - name: Publicar instalador para descarga
        uses: actions/upload-artifact@v4
        with:
          name: NUMEN-0-4-Android-APK
          path: instalador/NUMEN_0_4_Android.apk
          if-no-files-found: error
          retention-days: 30
