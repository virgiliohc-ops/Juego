name: Compilar Mi Mando LG 0.9
on:
  push:
    branches:
      - build/mimandolg-v0-9-preview
    paths:
      - 'mimandolg/**'
      - '.github/workflows/mimandolg-preview.yml'
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract source
        run: |
          mkdir -p build/mimandolg
          base64 --decode mimandolg/sources-v0.9.b64 > /tmp/mimandolg.zip
          unzip -q /tmp/mimandolg.zip -d build/mimandolg
      - name: Compile debug APK
        working-directory: build/mimandolg/MandoLG
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MiMandoLG-v0.9-vista-remota
          path: build/mimandolg/MandoLG/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
