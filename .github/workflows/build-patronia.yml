name: Compilar PatronIA Android
on:
  push:
    branches: [patronia-android]
  workflow_dispatch:

permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar paquete Android real
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Autorizar uso del emulador Android
        run: sudo chmod 666 /dev/kvm || true
      - name: Arranque real en emulador Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            set -e
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n com.patronia.taller/.MainActivity
            sleep 8
            adb shell pidof com.patronia.taller
            ! adb logcat -d -b crash | grep -q 'Process: com.patronia.taller'
            adb shell screencap -p /sdcard/PatronIA_emulador.png
            adb pull /sdcard/PatronIA_emulador.png PatronIA_emulador.png
      - name: Guardar captura del emulador
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PatronIA-prueba-arranque
          path: PatronIA_emulador.png
          if-no-files-found: ignore
      - name: Validar instalador
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          unzip -t "$APK" | tail -n 2
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 8
          mkdir -p paquete
          cp "$APK" paquete/PatronIA_v0.4_Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PatronIA-v0-4-Android
          path: paquete/PatronIA_v0.4_Android.apk
          if-no-files-found: error
          retention-days: 30
