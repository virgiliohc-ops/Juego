name: Compilar mando LG (prototipo)
on:
  push:
    branches:
      - build/mando-lg-webos-20261119
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon :app:assembleDebug
      - name: Verificar APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MiMandoLG-prototipo-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
