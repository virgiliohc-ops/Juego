name: Compilar PatronIA v0.5
on:
  push:
    branches: [patronia-v05]
    paths:
      - 'PatronIA/**'
      - '.github/workflows/patronia.yml'
permissions:
  contents: write
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Instalar Android
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          yes | sdkmanager --licenses > /dev/null || true
      - name: Compilar
        working-directory: PatronIA
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verificar APK
        run: |
          APK=PatronIA/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" | tail -n 2
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: PatronIA-v05-APK
          path: PatronIA/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Descargar directamente desde la rama
        run: |
          mkdir -p PatronIA/output
          cp PatronIA/app/build/outputs/apk/debug/app-debug.apk PatronIA/output/PatronIA_v0.5_Android.apk
          git config user.name 'GitHub Actions'
          git config user.email 'actions@users.noreply.github.com'
          git add PatronIA/output/PatronIA_v0.5_Android.apk
          if ! git diff --cached --quiet; then git commit -m 'Publicar PatronIA v0.5 APK'; git push origin HEAD:patronia-v05; fi
